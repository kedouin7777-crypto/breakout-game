function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = clamp(Math.round(r * (1 + amt)), 0, 255);
  g = clamp(Math.round(g * (1 + amt)), 0, 255);
  b = clamp(Math.round(b * (1 + amt)), 0, 255);
  return "rgb(" + r + "," + g + "," + b + ")";
}

function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
}

// 難易度別インデックス（易:0-24中:25-42難:43-50）
const PAT_TIERS = [
  [0,1,2,4,5,6,10,11,12,13,14,15,16,17,20,21,22,23,24,36,39,45],
  [3,7,8,9,18,19,25,26,27,35,37,40,41,42,43,44,46,48,50],
  [28,29,30,31,32,33,34,38,47,49],
];
let stagePatternIdx = null; // 1プレイ中のステージ別パターン（reset(true)で再抽選）
let stageNames = ["", "", "", ""];
function pickStagePatterns() {
  const used = new Set();
  stagePatternIdx = [];
  stageNames = ["", "", "", ""];
  for (let s = 0; s < STAGE_SPEEDS.length; s++) {
    const tier = PAT_TIERS[Math.min(s, PAT_TIERS.length - 1)];
    let idx;
    do { idx = tier[(Math.random() * tier.length) | 0]; } while (used.has(idx));
    used.add(idx);
    stagePatternIdx[s] = idx;
  }
}
pickStagePatterns();

function makeBlocks(s) {
  const pat = PATTERNS[stagePatternIdx[s]];
  stageNames[s] = pat.n;
  const list = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = pat.g[r].charCodeAt(c) - 48;
      if (ch <= 0) continue;
      const x = (W - (COLS * BLOCK_W + (COLS - 1) * GAP)) / 2 + c * (BLOCK_W + GAP);
      const y = TOP + r * (BLOCK_H + GAP);
      const hp = ch, kind = "normal";
      list.push({ x, y, w: BLOCK_W, h: BLOCK_H, hp, maxHp: hp, row: r, flash: 0, kind, hitX: 0, hitY: 0, hitShake: 0 });
    }
  }
  // ボーナス・鋼ブロックを配置
  if (list.length) {
    const bonusN = 2 + s;
    for (let i = 0; i < bonusN; i++) {
      const idx = (Math.random() * list.length) | 0;
      if (list[idx].kind === "normal") { list[idx].kind = "bonus"; list[idx].hp = list[idx].maxHp = 1; }
    }
    if (s >= 2) {
      const steelN = s === 3 ? 5 : 2;
      for (let i = 0; i < steelN; i++) {
        const idx = (Math.random() * list.length) | 0;
        if (list[idx].kind === "normal") { list[idx].kind = "steel"; list[idx].hp = list[idx].maxHp = 3; }
      }
    }
    const bombN = s >= 2 ? 2 : 1;
    for (let i = 0; i < bombN; i++) {
      const idx = (Math.random() * list.length) | 0;
      if (list[idx].kind === "normal") { list[idx].kind = "bomb"; list[idx].hp = list[idx].maxHp = 1; }
    }
    // 再帰ブロック（各ステージ1個）
    for (let i = 0; i < 12; i++) {
      const idx = (Math.random() * list.length) | 0;
      if (list[idx].kind === "normal") { list[idx].kind = "recurse"; list[idx].hp = list[idx].maxHp = 1; break; }
    }
  }
  return list;
}

function makeMiniBlocks() {
  // 内部ミニステージ用の固定レイアウト（12個）
  const list = [];
  const bw = 46, bh = 16, gap = 4;
  const rows = [
    [1, 1, 1, 1, 1],
    [0, 1, 1, 1, 0],
    [1, 2, 2, 2, 1],
  ];
  const x0 = (W - (5 * bw + 4 * gap)) / 2;
  const y0 = 130;
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < 5; c++) {
      const hp = rows[r][c];
      if (!hp) continue;
      list.push({ x: x0 + c * (bw + gap), y: y0 + r * (bh + gap), w: bw, h: bh, hp, maxHp: hp, row: r, flash: 0, kind: hp >= 2 ? "bonus" : "normal", hitX: 0, hitY: 0, hitShake: 0 });
    }
  }
  return list;
}

function makeStars() {
  const list = [];
  for (let i = 0; i < 140; i++) {
    const depth = Math.random();
    list.push({
      x: Math.random() * W, y: Math.random() * H,
      r: 0.4 + depth * 1.8, ph: Math.random() * Math.PI * 2,
      tw: 0.8 + Math.random() * 2.4, vy: 2 + depth * 14,
      depth, cross: Math.random() < 0.12
    });
  }
  return list;
}

function makeNebula() {
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const oc = off.getContext("2d");
  const blobs = [
    { x: W * 0.2, y: H * 0.25, r: 260, c: "rgba(70,110,220,0.16)" },
    { x: W * 0.8, y: H * 0.15, r: 220, c: "rgba(150,70,200,0.13)" },
    { x: W * 0.65, y: H * 0.7, r: 300, c: "rgba(40,140,190,0.10)" },
    { x: W * 0.15, y: H * 0.8, r: 200, c: "rgba(200,80,140,0.08)" }
  ];
  for (const b of blobs) {
    const g = oc.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0, b.c);
    g.addColorStop(1, "rgba(0,0,0,0)");
    oc.fillStyle = g;
    oc.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
  }
  return off;
}
const nebulaImg = makeNebula();

function drawMiniBackground(t) {
  // 内部ステージ専用背景：深い青緑＋遠近の渦と枠
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#041a20");
  bg.addColorStop(0.6, "#03141a");
  bg.addColorStop(1, "#01080c");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  // 背景の渦（内側へ続く空間の表現）
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.strokeStyle = "#3fd0e8";
  ctx.lineWidth = 1.2;
  const cx = W / 2, cy = H * 0.42;
  for (const off of [0, Math.PI]) {
    ctx.beginPath();
    for (let i = 0; i <= 90; i++) {
      const a = t * 0.35 + off + i * 0.14;
      const r = 8 + i * 4.2;
      const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r * 0.62;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.restore();
  // 内側の発光枠
  ctx.save();
  ctx.strokeStyle = "rgba(126,232,255,0.35)";
  ctx.lineWidth = 2;
  ctx.shadowColor = "#7ee8ff";
  ctx.shadowBlur = 14;
  roundRect(10, 48, W - 20, H - 58, 12);
  ctx.stroke();
  ctx.restore();
  // 四点のコーナーマーカー
  ctx.save();
  ctx.strokeStyle = "rgba(126,232,255,0.6)";
  ctx.lineWidth = 2.5;
  for (const [gx, gy, sx, sy] of [[16, 54, 1, 1], [W - 16, 54, -1, 1], [16, H - 16, 1, -1], [W - 16, H - 16, -1, -1]]) {
    ctx.beginPath();
    ctx.moveTo(gx + sx * 18, gy);
    ctx.lineTo(gx, gy);
    ctx.lineTo(gx, gy + sy * 18);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBackground(t) {
  if (mode === 1) { drawMiniBackground(t); return; }
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#0d1526");
  bg.addColorStop(0.5, "#0a0f1d");
  bg.addColorStop(1, "#05070d");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.drawImage(nebulaImg, 0, 0);

  // 床の遠近グリッド（下部に奥行き）
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.strokeStyle = "#4a76b8";
  ctx.lineWidth = 1;
  const horizon = H * 0.62;
  for (let i = 1; i <= 8; i++) {
    const y = horizon + Math.pow(i / 8, 2.2) * (H - horizon);
    ctx.beginPath();
    ctx.moveTo(0, y); ctx.lineTo(W, y);
    ctx.stroke();
  }
  for (let i = -10; i <= 10; i++) {
    ctx.beginPath();
    ctx.moveTo(W / 2 + i * 26, horizon);
    ctx.lineTo(W / 2 + i * 130, H);
    ctx.stroke();
  }
  ctx.restore();

  // オーロラ
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let k = 0; k < 3; k++) {
    const hue = [200, 265, 165][k];
    const yBase = 90 + k * 55;
    const grad = ctx.createLinearGradient(0, yBase - 70, 0, yBase + 130);
    grad.addColorStop(0, "hsla(" + hue + ",80%,60%,0)");
    grad.addColorStop(0.5, "hsla(" + hue + ",80%,60%,0.055)");
    grad.addColorStop(1, "hsla(" + hue + ",80%,60%,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 16) {
      const y = yBase + Math.sin(x * 0.008 + t * 0.35 + k * 2.1) * 34 + Math.sin(x * 0.021 - t * 0.22 + k) * 16;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // 星（遠景→近景、瞬きと流線）
  for (const s of stars) {
    const a = 0.12 + 0.5 * s.depth * (0.5 + 0.5 * Math.sin(t * s.tw + s.ph));
    ctx.fillStyle = "rgba(190,210,255," + a.toFixed(2) + ")";
    ctx.fillRect(s.x, s.y, s.r, s.r);
    if (s.cross && s.depth > 0.7) {
      ctx.save();
      ctx.globalAlpha = a * 0.8;
      ctx.strokeStyle = "rgba(210,230,255,0.8)";
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(s.x - 3, s.y); ctx.lineTo(s.x + 3, s.y);
      ctx.moveTo(s.x, s.y - 3); ctx.lineTo(s.x, s.y + 3);
      ctx.stroke();
      ctx.restore();
    }
  }

  // 流れ星
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const m of meteors) {
    const a = m.life / m.max;
    const vm = Math.hypot(m.vx, m.vy) || 1;
    const tl = 60 * a;
    const g = ctx.createLinearGradient(m.x, m.y, m.x - (m.vx / vm) * tl, m.y - (m.vy / vm) * tl);
    g.addColorStop(0, "rgba(220,240,255," + (0.8 * a).toFixed(2) + ")");
    g.addColorStop(1, "rgba(220,240,255,0)");
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - (m.vx / vm) * tl, m.y - (m.vy / vm) * tl);
    ctx.stroke();
    ctx.fillStyle = "rgba(240,250,255," + (0.9 * a).toFixed(2) + ")";
    ctx.beginPath();
    ctx.arc(m.x, m.y, 1.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function reset(full) {
  if (full) { stage = 0; score = 0; lives = 3; pickStagePatterns(); }
  blocks = makeBlocks(stage);
  balls = [{ x: paddle.x + paddle.w / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true, sp: STAGE_SPEEDS[stage], trail: [] }];
  caps = []; particles = []; popups = []; rings = [];
  glows = []; sparks = []; dying = []; fireworks = []; shocks = []; meteors = []; lasers = [];
  combo = 0; wideT = 0; slowT = 0; shakeT = 0;
  laserT = 0; laserCd = 0; fireT = 0; shieldT = 0;
  state = "ready";
}

function launch() {
  let launched = false;
  for (const b of balls) {
    if (b.stuck) {
      const a = -Math.PI / 2 + (Math.random() * 0.6 - 0.3);
      b.vx = Math.cos(a) * b.sp;
      b.vy = Math.sin(a) * b.sp;
      b.stuck = false;
      launched = true;
    }
  }
  if (launched) { state = "playing"; justReturned = false; }
}

function togglePause() {
  if (state === "playing" || state === "ready") state = "paused";
  else if (state === "paused") state = balls.some(b => b.stuck) ? "ready" : "playing";
}

// ---- 効果 ----
function spawnBurst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 140;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + Math.random() * 0.3, max: 0.8, color, r: 2 + Math.random() * 2.5 });
  }
}
function spawnShards(bl, color) {
  const hw = bl.w / 2, hh = bl.h / 2;
  for (let i = 0; i < 6; i++) {
    const sx = bl.x + (i % 3) * hw, sy = bl.y + (i < 3 ? 0 : hh);
    particles.push({
      x: sx + hw / 2, y: sy + hh / 2,
      vx: (sx - bl.x - hw + (Math.random() * 20 - 10)) * 2.2,
      vy: -60 - Math.random() * 120,
      g: 420, rot: Math.random() * Math.PI, vr: (Math.random() * 2 - 1) * 8,
      life: 0.55 + Math.random() * 0.25, max: 0.8, color,
      r: Math.min(hw, hh) * (0.5 + Math.random() * 0.35), shard: true
    });
  }
}
function addPopup(x, y, text, color) {
  popups.push({ x, y, text, color, life: 0.8, max: 0.8 });
}
function shake(mag, dur) { shakeMag = mag; shakeT = dur; }
function spawnRing(x, y, color, max) {
  rings.push({ x, y, r: 6, max: max || 34, life: 0.35, maxLife: 0.35, color });
}
function spawnShock(x, y, color) {
  shocks.push({ x, y, r: 4, life: 0.4, maxLife: 0.4, color });
}
function addGlow(x, y, r, color, strength) {
  glows.push({ x, y, r, color, s: strength });
}
function spawnSparks(x, y, color, n, spread) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * (spread || 180);
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 0.25 + Math.random() * 0.3, max: 0.55, color, len: 3 + Math.random() * 5 });
  }
}
function spawnFirework(x, y) {
  const hue = (Math.random() * 360) | 0;
  const n = 26 + (Math.random() * 14 | 0);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.2;
    const sp = 90 + Math.random() * 160;
    fireworks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.7 + Math.random() * 0.5, max: 1.2, color: "hsl(" + hue + ",90%,65%)" });
  }
  spawnRing(x, y, "hsl(" + hue + ",90%,70%)", 60);
}

// ---- 音 ----
let actx = null;
function initAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  if (actx && actx.state === "suspended") actx.resume();
}
function beep(freq, dur, type, gain) {
  if (!actx || muted) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(gain || 0.15, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start();
    o.stop(actx.currentTime + dur);
  } catch (e) { /* 音はなくてもいい */ }
}

function winJingle() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.22, "triangle", 0.2), i * 130));
}

// ---- 入力 ----
const keys = {};
addEventListener("keydown", (e) => {
  if (["Space", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  initAudio();
  if (e.code === "Space" && state === "ready") launch();
  if ((e.code === "Enter" || e.code === "Space") && (state === "win" || state === "lose")) reset(true);
  if ((e.code === "KeyP" || e.code === "Escape") && !e.repeat) togglePause();
  if (e.code === "KeyM" && !e.repeat) muted = !muted;
});
addEventListener("keyup", (e) => { keys[e.code] = false; });

function pointerX(e) {
  const rect = canvas.getBoundingClientRect();
  return (e.clientX - rect.left) * (W / rect.width);
}
function movePaddle(x) {
  paddle.tx = clamp(x - paddle.w / 2, 0, W - paddle.w);
}
canvas.addEventListener("mousemove", (e) => movePaddle(pointerX(e)));
canvas.addEventListener("mousedown", () => {
  initAudio();
  if (state === "ready") launch();
  else if (state === "paused") state = balls.some(b => b.stuck) ? "ready" : "playing";
  else if (state === "win" || state === "lose") reset(true);
});
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  initAudio();
  if (e.touches.length) movePaddle(pointerX(e.touches[0]));
  if (state === "ready") launch();
  else if (state === "paused") state = balls.some(b => b.stuck) ? "ready" : "playing";
  else if (state === "win" || state === "lose") reset(true);
}, { passive: false });
canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();
  if (e.touches.length) movePaddle(pointerX(e.touches[0]));
}, { passive: false });

// ---- 衝突 ----
function collideWalls(b) {
  if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx); beep(150, 0.05, "square", 0.12); spawnSparks(BALL_R, b.y, "#9ecbff", 6, 140); wallHitT = 0.12; }
  else if (b.x > W - BALL_R) { b.x = W - BALL_R; b.vx = -Math.abs(b.vx); beep(150, 0.05, "square", 0.12); spawnSparks(W - BALL_R, b.y, "#9ecbff", 6, 140); wallHitT = 0.12; }
  if (b.y < BALL_R) { b.y = BALL_R; b.vy = Math.abs(b.vy); beep(150, 0.05, "square", 0.12); spawnSparks(b.x, BALL_R, "#9ecbff", 6, 140); wallHitT = 0.12; }
}

// 水平走行防止：バー接触・ブロック破壊から一定時間経過すると斜め上へ修正
const IDLE_STEER = 10;
function steerIdleBalls(dt) {
  for (const b of balls) {
    if (b.stuck) continue;
    b.idleT = (b.idleT || 0) + dt;
    if (b.idleT >= IDLE_STEER) {
      b.idleT = 0;
      const sp = Math.hypot(b.vx, b.vy) || b.sp;
      const a = Math.atan2(b.vy, b.vx);
      const dir = b.vx >= 0 ? 1 : -1;
      const na = dir === 1 ? -Math.PI / 4 : -Math.PI * 3 / 4;
      let da = na - a;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      const turn = clamp(da, -0.5, 0.5);
      const a2 = a + turn;
      b.vx = Math.cos(a2) * sp;
      b.vy = Math.sin(a2) * sp;
      if (b.vy > -sp * 0.35) b.vy = -sp * 0.35;
      spawnRing(b.x, b.y, "#7ec8ff", 26);
      beep(320, 0.05, "sine", 0.1);
    }
  }
}

function collidePaddle(b) {
  if (b.vy <= 0) return;
  if (b.y + BALL_R >= PADDLE_Y && b.y - BALL_R < PADDLE_Y + PADDLE_H &&
      b.x >= paddle.x - BALL_R && b.x <= paddle.x + paddle.w + BALL_R) {
    const rel = clamp((b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
    const a = rel * (Math.PI * 0.35);
    b.sp = Math.min(b.sp * 1.05, MAX_SPEED);
    b.vx = Math.sin(a) * b.sp;
    b.vy = -Math.cos(a) * b.sp;
    b.y = PADDLE_Y - BALL_R;
    b.idleT = 0;
    paddleHitT = 0.18;
    spawnSparks(b.x, PADDLE_Y, wideT > 0 ? "#8bf05a" : "#6ab8ff", 8, 200);
    spawnRing(b.x, PADDLE_Y, wideT > 0 ? "#8bf05a" : "#6ab8ff", 26);
    if (combo >= 3) addPopup(b.x, b.y - 26, "COMBO " + combo, "#ffe14a");
    combo = 0;
    beep(240, 0.06, "square", 0.18);
  }
}

function dropCap(bl) {
  const types = ["multi", "wide", "slow", "life", "laser", "fire", "shield"];
  caps.push({ x: bl.x + bl.w / 2, y: bl.y + bl.h / 2, type: types[(Math.random() * types.length) | 0] });
}

function maybeDropCap(bl) {
  if (Math.random() >= CAP_DROP) return;
  dropCap(bl);
}

function applyCap(c) {
  beep(660, 0.12, "sine", 0.22);
  spawnBurst(c.x, c.y, CAP_TYPES[c.type].color, 10);
  if (c.type === "multi") {
    const src = balls.find(x => !x.stuck);
    if (src && balls.length < MAX_BALLS) {
      const a = Math.atan2(src.vy, src.vx) + (Math.random() < 0.5 ? 0.5 : -0.5);
      balls.push({ x: src.x, y: src.y, vx: Math.cos(a) * src.sp, vy: Math.sin(a) * src.sp, stuck: false, sp: src.sp, trail: [] });
    }
  } else if (c.type === "wide") {
    wideT = WIDE_TIME;
  } else if (c.type === "slow") {
    slowT = SLOW_TIME;
  } else if (c.type === "life") {
    lives = Math.min(lives + 1, MAX_LIVES);
  } else if (c.type === "laser") {
    laserT = LASER_TIME;
  } else if (c.type === "fire") {
    fireT = FIRE_TIME;
  } else if (c.type === "shield") {
    shieldT = SHIELD_TIME;
  }
}

function enterRecurse(bl, b) {
  // 通常ステージを退避し、ズーム演出後に内部ミニステージへ
  savedOuter = {
    blocks: blocks, balls: balls, caps: caps,
    wideT: wideT, slowT: slowT, laserT: laserT, fireT: fireT, shieldT: shieldT
  };
  pendingRecurse = bl;
  b.x = bl.x + bl.w / 2; b.y = bl.y + bl.h / 2;
  b.vx = 0; b.vy = 0;
  zoom = { t: 0, dur: 0.55, x: bl.x + bl.w / 2, y: bl.y + bl.h / 2 };
  state = "zoomin";
  spawnRing(bl.x + bl.w / 2, bl.y + bl.h / 2, "#7ee8ff", 60);
  spawnShock(bl.x + bl.w / 2, bl.y + bl.h / 2, "#7ee8ff");
  beep(700, 0.18, "sine", 0.18);
  setTimeout(() => beep(1200, 0.14, "sine", 0.14), 120);
}

function startMini() {
  mode = 1;
  blocks = makeMiniBlocks();
  balls = [{ x: paddle.x + paddle.w / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true, sp: STAGE_SPEEDS[stage], trail: [] }];
  caps = []; lasers = [];
  state = "ready";
}

function exitRecurse() {
  // 内部から破裂して復帰
  const bl = pendingRecurse;
  mode = 0;
  blocks = savedOuter.blocks;
  balls = savedOuter.balls;
  caps = savedOuter.caps;
  wideT = savedOuter.wideT; slowT = savedOuter.slowT; laserT = savedOuter.laserT;
  fireT = savedOuter.fireT; shieldT = savedOuter.shieldT;
  savedOuter = null; pendingRecurse = null;
  if (bl) {
    const idx = blocks.indexOf(bl);
    if (idx >= 0) blocks.splice(idx, 1);
    dying.push({ x: bl.x, y: bl.y, w: bl.w, h: bl.h, color: "#7ee8ff", life: 0.3, maxLife: 0.3 });
    spawnBurst(bl.x + bl.w / 2, bl.y + bl.h / 2, "#7ee8ff", 22);
    spawnShards(bl, "#7ee8ff");
    spawnRing(bl.x + bl.w / 2, bl.y + bl.h / 2, "#7ee8ff", 90);
    spawnShock(bl.x + bl.w / 2, bl.y + bl.h / 2, "#9ff0ff");
    addGlow(bl.x + bl.w / 2, bl.y + bl.h / 2, 180, "#7ee8ff", 0.5);
    shake(6, 0.2);
    // ボールは復帰後、パドル上の初期位置で待发射（スペース/クリックで発射）
    balls = [{ x: paddle.x + paddle.w / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true, sp: STAGE_SPEEDS[stage], trail: [] }];
  }
  score += RECURSE_BONUS;
  addPopup(W / 2, H / 2 - 40, "INNER CLEAR +" + RECURSE_BONUS, "#7ee8ff");
  zoom = { t: 0, dur: 0.4, x: 0, y: 0 };
  state = "zoomout";
  returnToPaddle = true;
  beep(300, 0.2, "triangle", 0.22);
}

function explodeBlock(bl) {
  const cx = bl.x + bl.w / 2, cy = bl.y + bl.h / 2, R = 95;
  spawnRing(cx, cy, "#ff8a4a", 120);
  spawnShock(cx, cy, "#ffb060");
  spawnBurst(cx, cy, "#ff8a4a", 26);
  spawnSparks(cx, cy, "#ffd54a", 18, 320);
  addGlow(cx, cy, 200, "#ff8a4a", 0.55);
  shake(7, 0.22);
  beep(120, 0.25, "sawtooth", 0.25);
  const victims = blocks.filter(o => Math.hypot(o.x + o.w / 2 - cx, o.y + o.h / 2 - cy) <= R);
  for (const o of victims) {
    const idx = blocks.indexOf(o);
    if (idx < 0) continue;
    blocks.splice(idx, 1);
    const vc = o.kind === "bomb" ? "#ff8a4a" : o.kind === "steel" ? "#c3ccdd" : ROW_COLORS[o.row];
    dying.push({ x: o.x, y: o.y, w: o.w, h: o.h, color: vc, life: 0.28, maxLife: 0.28 });
    spawnBurst(o.x + o.w / 2, o.y + o.h / 2, vc, 8);
    score += 40;
    addPopup(o.x + o.w / 2, o.y - 6, "+40", "#ffb060");
    if (o.kind === "bomb") explodeBlock(o);
    else if (o.kind !== "steel") maybeDropCap(o);
  }
}

function collideBlocks(b) {
  for (let i = blocks.length - 1; i >= 0; i--) {
    const bl = blocks[i];
    const cx = clamp(b.x, bl.x, bl.x + bl.w);
    const cy = clamp(b.y, bl.y, bl.y + bl.h);
    const dx = b.x - cx, dy = b.y - cy;
    if (dx * dx + dy * dy > BALL_R * BALL_R) continue;
    const pierce = fireT > 0 && bl.kind !== "steel" && bl.kind !== "bomb";
    if (!pierce) {
      if (Math.abs(dx) > Math.abs(dy)) {
        b.x = cx + (dx >= 0 ? BALL_R : -BALL_R);
        b.vx = (dx >= 0 ? 1 : -1) * Math.abs(b.vx);
      } else {
        b.y = cy + (dy >= 0 ? BALL_R : -BALL_R);
        b.vy = (dy >= 0 ? 1 : -1) * Math.abs(b.vy);
      }
    }
    combo++;
    comboT = 2.2;
    b.idleT = 0;
    if (bl.kind === "recurse" && mode === 0) {
      enterRecurse(bl, b);
      return true;
    }
    bl.flash = 1;
    bl.hitShake = 1;
    bl.hitX = b.vx >= 0 ? -1 : 1;
    bl.hitY = b.vy >= 0 ? -1 : 1;
    const mult = 1 + Math.min(combo, 20) * 0.05;
    const destroyed = (--bl.hp <= 0);
    if (destroyed && bl.kind === "bomb") explodeBlock(bl);
    let base;
    if (bl.kind === "bonus") base = destroyed ? 150 : 30;
    else if (bl.kind === "steel") base = destroyed ? 200 : 40;
    else base = destroyed ? (bl.maxHp === 2 ? 100 : 50) : 25;
    const pts = Math.round(base * mult);
    score += pts;
    addPopup(bl.x + bl.w / 2, bl.y - 6, "+" + pts, destroyed ? "#ffffff" : "#9aa7c7");
    if (destroyed) {
      blocks.splice(i, 1);
      const burstColor = bl.kind === "bonus" ? "#ffd54a" : bl.kind === "steel" ? "#c3ccdd" : bl.kind === "bomb" ? "#ff8a4a" : ROW_COLORS[bl.row];
      dying.push({ x: bl.x, y: bl.y, w: bl.w, h: bl.h, color: burstColor, life: 0.28, maxLife: 0.28 });
      spawnBurst(bl.x + bl.w / 2, bl.y + bl.h / 2, burstColor, bl.kind === "bonus" ? 18 : 12);
      spawnShards(bl, burstColor);
      spawnRing(bl.x + bl.w / 2, bl.y + bl.h / 2, burstColor, bl.kind === "bonus" ? 46 : 32);
      spawnShock(bl.x + bl.w / 2, bl.y + bl.h / 2, burstColor);
      spawnSparks(bl.x + bl.w / 2, bl.y + bl.h / 2, burstColor, bl.kind === "bonus" ? 14 : 8, 240);
      addGlow(bl.x + bl.w / 2, bl.y + bl.h / 2, bl.kind === "bonus" ? 130 : 90, burstColor, bl.kind === "bonus" ? 0.5 : 0.32);
      shake(bl.kind === "bonus" ? 4 : 2.5, 0.14);
      if (bl.kind === "bonus") dropCap(bl);
      else if (bl.kind !== "steel") maybeDropCap(bl);
    }
    beep(destroyed ? 420 + Math.min(combo, 20) * 15 : 330, destroyed ? 0.07 : 0.05, "triangle", destroyed ? 0.2 : 0.15);
    return true;
  }
  return false;
}

// ---- 更新 ----
function update(dt) {
  if (keys["ArrowLeft"] || keys["KeyA"]) paddle.tx -= PADDLE_SPEED * dt;
  if (keys["ArrowRight"] || keys["KeyD"]) paddle.tx += PADDLE_SPEED * dt;
  paddle.tx = clamp(paddle.tx, 0, W - paddle.w);
  paddle.x += (paddle.tx - paddle.x) * Math.min(1, dt * 18);
  const targetW = PADDLE_BASE_W * (wideT > 0 ? WIDE_MULT : 1);
  paddle.w += (targetW - paddle.w) * Math.min(1, dt * 10);
  paddle.x = clamp(paddle.x, 0, W - paddle.w);
  paddle.tx = clamp(paddle.tx, 0, W - paddle.w);

  if (wideT > 0) wideT = Math.max(0, wideT - dt);
  if (slowT > 0) slowT = Math.max(0, slowT - dt);
  if (laserT > 0) laserT = Math.max(0, laserT - dt);
  if (laserCd > 0) laserCd = Math.max(0, laserCd - dt);
  if (fireT > 0) fireT = Math.max(0, fireT - dt);
  if (shieldT > 0) shieldT = Math.max(0, shieldT - dt);
  if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);

  for (const s of stars) {
    s.y += s.vy * dt;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }
  for (const bl of blocks) {
    if (bl.flash > 0) bl.flash = Math.max(0, bl.flash - dt * 4);
    if (bl.hitShake > 0) bl.hitShake = Math.max(0, bl.hitShake - dt * 7);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 200) * dt;
    if (p.shard) p.rot += p.vr * dt;
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].life -= dt;
    popups[i].y -= 24 * dt;
    if (popups[i].life <= 0) popups.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.life -= dt;
    if (r.life <= 0) { rings.splice(i, 1); continue; }
    const k = 1 - r.life / r.maxLife;
    r.r = 6 + (r.max - 6) * k;
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.life -= dt;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 320 * dt;
  }
  for (let i = dying.length - 1; i >= 0; i--) {
    dying[i].life -= dt;
    if (dying[i].life <= 0) dying.splice(i, 1);
  }
  for (let i = fireworks.length - 1; i >= 0; i--) {
    const f = fireworks[i];
    f.life -= dt;
    if (f.life <= 0) { fireworks.splice(i, 1); continue; }
    f.x += f.vx * dt; f.y += f.vy * dt;
    f.vx *= 0.985; f.vy = f.vy * 0.985 + 60 * dt;
  }
  for (let i = glows.length - 1; i >= 0; i--) {
    glows[i].s -= dt * 1.6;
    if (glows[i].s <= 0) glows.splice(i, 1);
  }
  for (let i = shocks.length - 1; i >= 0; i--) {
    const s = shocks[i];
    s.life -= dt;
    if (s.life <= 0) { shocks.splice(i, 1); continue; }
    const k = 1 - s.life / s.maxLife;
    s.r = 4 + 120 * (1 - Math.pow(1 - k, 3));
  }
  // 流れ星
  if (Math.random() < dt * 0.35) {
    const mx = Math.random() * W, my = Math.random() * H * 0.35;
    const va = Math.PI * (0.15 + Math.random() * 0.2);
    const sp = 320 + Math.random() * 260;
    meteors.push({ x: mx, y: my, vx: Math.cos(va) * sp * (Math.random() < 0.5 ? -1 : 1), vy: Math.sin(va) * sp, life: 0.9, max: 0.9 });
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.life -= dt;
    if (m.life <= 0) { meteors.splice(i, 1); continue; }
    m.x += m.vx * dt; m.y += m.vy * dt;
  }
  if (paddleHitT > 0) paddleHitT = Math.max(0, paddleHitT - dt);
  if (wallHitT > 0) wallHitT = Math.max(0, wallHitT - dt);
  if (vignetteT > 0) vignetteT = Math.max(0, vignetteT - dt * 0.8);

  if (state === "paused" || state === "win" || state === "lose") return;

  // 反射角度ナビ：ボールがパドルへ接近中のみフェードイン／ヒットで即消え
  let navNear = false;
  for (const b of balls) {
    if (!b.stuck && b.vy > 0 && b.y < PADDLE_Y && PADDLE_Y - b.y < NAV.showDist) { navNear = true; break; }
  }
  navFade += ((navNear ? 1 : 0) - navFade) * Math.min(1, dt * 8);
  if (paddleHitT > 0) navFade = 0;

  // 再帰ブロックの突入/復帰ズーム演出（この間、ステージ進行は止まる）
  if (state === "zoomin") {
    zoom.t += dt;
    if (zoom.t >= zoom.dur) startMini();
    return;
  }
  if (state === "zoomout") {
    zoom.t += dt;
    if (zoom.t >= zoom.dur) {
      if (returnToPaddle) {
        returnToPaddle = false;
        justReturned = true;
        state = "ready";
      } else {
        state = "playing";
      }
    }
    return;
  }

  // レーザー発射
  if (laserT > 0 && state === "playing" && laserCd <= 0) {
    laserCd = LASER_CD;
    const px = paddle.x + paddle.w / 2;
    lasers.push({ x: px - paddle.w / 2 + 6, y: PADDLE_Y - 4 });
    lasers.push({ x: px + paddle.w / 2 - 6, y: PADDLE_Y - 4 });
    beep(880, 0.05, "square", 0.1);
  }
  for (let i = lasers.length - 1; i >= 0; i--) {
    const L = lasers[i];
    L.y -= 720 * dt;
    if (L.y < -10) { lasers.splice(i, 1); continue; }
    let hit = false;
    for (let j = blocks.length - 1; j >= 0; j--) {
      const bl = blocks[j];
      if (L.x >= bl.x && L.x <= bl.x + bl.w && L.y <= bl.y + bl.h && L.y >= bl.y) {
        hit = true;
        bl.flash = 1;
        bl.hitShake = 1;
        bl.hitX = 0; bl.hitY = -1;
        spawnSparks(L.x, L.y, "#ff6bd0", 6, 160);
        const destroyed = (--bl.hp <= 0);
        if (destroyed) {
          blocks.splice(j, 1);
          score += 30;
          addPopup(bl.x + bl.w / 2, bl.y - 6, "+30", "#ff6bd0");
          const vc = bl.kind === "bomb" ? "#ff8a4a" : bl.kind === "steel" ? "#c3ccdd" : ROW_COLORS[bl.row];
          dying.push({ x: bl.x, y: bl.y, w: bl.w, h: bl.h, color: vc, life: 0.28, maxLife: 0.28 });
          spawnBurst(bl.x + bl.w / 2, bl.y + bl.h / 2, vc, 10);
          spawnRing(bl.x + bl.w / 2, bl.y + bl.h / 2, vc, 30);
          if (bl.kind === "bomb") explodeBlock(bl);
          else if (bl.kind !== "steel") maybeDropCap(bl);
        }
        break;
      }
    }
    if (hit) lasers.splice(i, 1);
  }

  if (state === "levelclear") {
    clearT -= dt;
    if (Math.random() < dt * 6) spawnFirework(60 + Math.random() * (W - 120), 80 + Math.random() * (H * 0.5));
    if (clearT <= 0) {
      stage++;
      if (stage >= STAGE_SPEEDS.length) { state = "win"; winJingle(); saveBest(); }
      else reset(false);
    }
    return;
  }

  for (const b of balls) {
    if (b.stuck) { b.x = paddle.x + paddle.w / 2; b.y = PADDLE_Y - BALL_R - 1; }
  }
  if (state === "ready") return;

  if (comboT > 0) {
    comboT = Math.max(0, comboT - dt);
    if (comboT === 0) combo = 0;
  }

  for (let i = caps.length - 1; i >= 0; i--) {
    const c = caps[i];
    c.y += CAP_FALL * dt;
    if (c.y + CAP_R >= PADDLE_Y && c.y - CAP_R <= PADDLE_Y + PADDLE_H &&
        c.x >= paddle.x - CAP_R && c.x <= paddle.x + paddle.w + CAP_R) {
      applyCap(c);
      caps.splice(i, 1);
    } else if (c.y - CAP_R > H) {
      caps.splice(i, 1);
    }
  }

  const slowMult = slowT > 0 ? SLOW_MULT : 1;
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    const dist = Math.hypot(b.vx, b.vy) * slowMult * dt;
    const steps = Math.max(1, Math.ceil(dist / 3));
    for (let s = 0; s < steps; s++) {
      b.x += (b.vx * slowMult * dt) / steps;
      b.y += (b.vy * slowMult * dt) / steps;
      collideWalls(b);
      collidePaddle(b);
      collideBlocks(b);
    }
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 10) b.trail.shift();
    if (b.y - BALL_R > H) {
      if (shieldT > 0) {
        b.y = H + BALL_R - 2;
        b.vy = -Math.abs(b.vy);
        spawnRing(b.x, H - 6, "#59e6d0", 40);
        spawnSparks(b.x, H - 8, "#59e6d0", 10, 220);
        beep(520, 0.08, "sine", 0.18);
      } else {
        balls.splice(i, 1);
      }
    }
  }
  steerIdleBalls(dt);

  if (balls.length === 0) {
    lives--;
    beep(110, 0.3, "sawtooth", 0.2);
    shake(5, 0.3);
    vignetteT = 1;
    if (lives <= 0) { state = "lose"; saveBest(); }
    else reset(false);
    return;
  }

  if (blocks.length === 0) {
    if (mode === 1) { exitRecurse(); return; }
    score += lives * 100;
    state = "levelclear";
    clearT = 1.8;
    for (let i = 0; i < 3; i++) {
      addGlow(80 + Math.random() * (W - 160), 70 + Math.random() * (H * 0.45), 160, "#8bf05a", 0.3);
    }
    for (let i = 0; i < 5; i++) spawnFirework(80 + Math.random() * (W - 160), 70 + Math.random() * (H * 0.45));
    saveBest();
  }
}

// ---- 描画 ----
function drawBlock(b) {
  const damaged = b.hp < b.maxHp;
  let base;
  if (b.kind === "bonus") base = "#ffd54a";
  else if (b.kind === "steel") base = damaged ? "#7f8aa0" : "#9aa6bd";
  else if (b.kind === "bomb") base = "#3a3f52";
  else if (b.kind === "recurse") base = "#123a4a";
  else base = ROW_COLORS[b.row];
  const t = performance.now() / 1000;

  ctx.save();
  // ヒット時のシェイク（跳ね返った方向へ押し戻される揺れ）
  if (b.hitShake > 0) {
    const k = b.hitShake * b.hitShake;
    ctx.translate(b.hitX * k * 5, b.hitY * k * 5);
  }
  // 接地影
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  roundRect(b.x + 2, b.y + 3, b.w, b.h, 5);
  ctx.fill();

  // 本体：上から光が当たる立体グラデ
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  g.addColorStop(0, shade(base, 0.28));
  g.addColorStop(0.45, base);
  g.addColorStop(1, shade(base, -0.42));
  ctx.fillStyle = g;
  roundRect(b.x, b.y, b.w, b.h, 5);
  ctx.fill();

  // ベベル（上明・下暗）
  ctx.strokeStyle = "rgba(255,255,255,0.45)";
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(b.x + 5, b.y + 1.2);
  ctx.lineTo(b.x + b.w - 5, b.y + 1.2);
  ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,0.4)";
  ctx.beginPath();
  ctx.moveTo(b.x + 5, b.y + b.h - 1.2);
  ctx.lineTo(b.x + b.w - 5, b.y + b.h - 1.2);
  ctx.stroke();

  // 左上のスペキュラ
  const sp = ctx.createLinearGradient(b.x, b.y, b.x + b.w * 0.5, b.y + b.h);
  sp.addColorStop(0, "rgba(255,255,255,0.30)");
  sp.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = sp;
  roundRect(b.x + 2, b.y + 2, b.w - 4, b.h * 0.5, 3);
  ctx.fill();

  if (b.kind === "bonus") {
    // 金色の脈動発光と星
    const pulse = 0.5 + 0.5 * Math.sin(t * 4 + b.x * 0.1);
    ctx.shadowColor = "#ffd54a";
    ctx.shadowBlur = 10 + 8 * pulse;
    ctx.strokeStyle = "rgba(255,225,120," + (0.5 + 0.4 * pulse).toFixed(2) + ")";
    ctx.lineWidth = 1.5;
    roundRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2, 4);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.font = "bold 15px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("★", b.x + b.w / 2, b.y + b.h / 2 + 5);
  }
  if (b.kind === "steel") {
    // ブラシ目＋リベット
    ctx.strokeStyle = "rgba(255,255,255,0.10)";
    ctx.lineWidth = 1;
    for (let i = 1; i < 5; i++) {
      ctx.beginPath();
      ctx.moveTo(b.x + 4, b.y + i * b.h / 5);
      ctx.lineTo(b.x + b.w - 4, b.y + i * b.h / 5);
      ctx.stroke();
    }
    for (const [rx, ry] of [[7, 6], [b.w - 7, 6], [7, b.h - 6], [b.w - 7, b.h - 6]]) {
      const rg = ctx.createRadialGradient(b.x + rx - 0.7, b.y + ry - 0.7, 0.4, b.x + rx, b.y + ry, 2.6);
      rg.addColorStop(0, "#e8eef8");
      rg.addColorStop(1, "#5d6878");
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(b.x + rx, b.y + ry, 2.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (b.kind === "bomb") {
    // 黒い砲弾ブロック：赤い点滅ライトと信管
    const pulse = 0.5 + 0.5 * Math.sin(t * 6 + b.x * 0.2);
    ctx.fillStyle = "rgba(255,90,60," + (0.35 + 0.5 * pulse).toFixed(2) + ")";
    ctx.beginPath();
    ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,140,90,0.5)";
    ctx.lineWidth = 1.5;
    roundRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4, 4);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,170,120,0.7)";
    ctx.beginPath();
    ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 8, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (b.kind === "recurse") {
    // 内部へ続く渦巻きコア（奥行き表現）
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const rot = t * 1.6;
    const hole = ctx.createRadialGradient(cx, cy, 1, cx, cy, Math.min(b.w, b.h) * 0.55);
    hole.addColorStop(0, "rgba(0,10,18,0.95)");
    hole.addColorStop(0.6, "rgba(20,80,110,0.55)");
    hole.addColorStop(1, "rgba(126,232,255,0)");
    ctx.fillStyle = hole;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.min(b.w, b.h) * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = "rgba(126,232,255,0.75)";
    ctx.lineWidth = 1.4;
    for (const off of [0, Math.PI]) {
      ctx.beginPath();
      for (let i = 0; i <= 24; i++) {
        const a = rot + off + i * 0.26;
        const r = 1.5 + i * 0.85;
        const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r * 0.7;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    const pulse = 0.5 + 0.5 * Math.sin(t * 3 + b.x * 0.1);
    ctx.fillStyle = "rgba(160,245,255," + (0.5 + 0.4 * pulse).toFixed(2) + ")";
    ctx.beginPath();
    ctx.arc(cx, cy, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "rgba(126,232,255," + (0.4 + 0.3 * (0.5 + 0.5 * Math.sin(t * 2.4))).toFixed(2) + ")";
    ctx.lineWidth = 1.5;
    roundRect(b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3, 4);
    ctx.stroke();
  }

  // HPリング（複数HPブロック）
  if (b.maxHp > 1 && b.hp > 1) {
    ctx.strokeStyle = "rgba(255,255,255,0.75)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(b.x + b.w - 11, b.y + b.h / 2, 5.5, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * b.hp / b.maxHp));
    ctx.stroke();
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(b.x + b.w - 11, b.y + b.h / 2, 5.5, 0, Math.PI * 2);
    ctx.stroke();
  }

  if (b.flash > 0) {
    ctx.fillStyle = "rgba(255,255,255," + (0.6 * b.flash).toFixed(2) + ")";
    roundRect(b.x, b.y, b.w, b.h, 5);
    ctx.fill();
  }
  if (damaged) {
    ctx.strokeStyle = "rgba(10,12,20,0.6)";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(b.x + b.w * 0.28, b.y + 3);
    ctx.lineTo(b.x + b.w * 0.42, b.y + b.h * 0.5);
    ctx.lineTo(b.x + b.w * 0.34, b.y + b.h - 3);
    ctx.moveTo(b.x + b.w * 0.62, b.y + 2);
    ctx.lineTo(b.x + b.w * 0.55, b.y + b.h * 0.6);
    ctx.lineTo(b.x + b.w * 0.68, b.y + b.h - 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawTitleDemo() {
  const t = performance.now() / 1000;
  const cx = W / 2, cy = H / 2 + 130, rx = 190, ry = 62;
  ctx.save();
  ctx.strokeStyle = "rgba(126,200,255,0.18)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 3; i++) {
    const a = t * 1.6 + i * Math.PI * 2 / 3;
    const x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
    const col = ROW_COLORS[i % ROW_COLORS.length];
    // 残像
    for (let k = 1; k <= 5; k++) {
      const aa = a - k * 0.12;
      ctx.globalAlpha = (0.3 - k * 0.05) * (0.6 + 0.4 * Math.sin(a));
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(aa) * rx, cy + Math.sin(aa) * ry, 6 - k * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
    // 本体＋ハロー
    ctx.globalAlpha = 0.9;
    const hg = ctx.createRadialGradient(x, y, 1, x, y, 18);
    hg.addColorStop(0, hexToRgba(col, 0.6));
    hg.addColorStop(1, hexToRgba(col, 0));
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawOverlay(title, color, lines) {
  const t = performance.now() / 1000;
  ctx.fillStyle = "rgba(5, 8, 15, 0.62)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  // タイトル：グラデ＋発光＋揺れ
  ctx.save();
  const wob = Math.sin(t * 2) * 2;
  ctx.shadowColor = color;
  ctx.shadowBlur = 26 + 8 * Math.sin(t * 3);
  const tg = ctx.createLinearGradient(0, H / 2 - 80, 0, H / 2 - 30);
  tg.addColorStop(0, "#ffffff");
  tg.addColorStop(1, color);
  ctx.fillStyle = tg;
  ctx.font = "bold 46px sans-serif";
  ctx.fillText(title, W / 2, H / 2 - 44 + wob);
  ctx.restore();
  // 下線グロー
  ctx.save();
  ctx.strokeStyle = hexToRgba(color, 0.5);
  ctx.lineWidth = 2;
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 130, H / 2 - 26);
  ctx.lineTo(W / 2 + 130, H / 2 - 26);
  ctx.stroke();
  ctx.restore();
  ctx.font = "20px sans-serif";
  ctx.fillStyle = "#dfe6f5";
  lines.forEach((line, i) => ctx.fillText(line, W / 2, H / 2 + 8 + i * 30));
}

function draw() {
  const t = performance.now() / 1000;
  // 再帰ブロック突入/復帰のズーム演出（画面全体変換）
  const zooming = (state === "zoomin" || state === "zoomout") && pendingRecurse;
  let zk = 0;
  if (zooming) {
    const k = Math.min(1, zoom.t / zoom.dur);
    zk = state === "zoomin" ? k : 1 - k;
    const cx = pendingRecurse.x + pendingRecurse.w / 2;
    const cy = pendingRecurse.y + pendingRecurse.h / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1 + zk * 14, 1 + zk * 14);
    ctx.translate(-cx, -cy);
    // 拡大範囲外（単色化して見えた部分）を埋める下地
    ctx.fillStyle = "#02060c";
    ctx.fillRect(-W, -H, W * 3, H * 3);
  }
  drawBackground(t);

  ctx.save();
  if (shakeT > 0) ctx.translate((Math.random() * 2 - 1) * shakeMag, (Math.random() * 2 - 1) * shakeMag);

  for (const b of blocks) drawBlock(b);

  // 破壊ブロックの縮小フェード
  for (const d of dying) {
    const k = d.life / d.maxLife;
    const cw = d.w * (0.7 + 0.3 * k), ch = d.h * (0.7 + 0.3 * k);
    ctx.save();
    ctx.globalAlpha = k * 0.85;
    ctx.fillStyle = d.color;
    ctx.shadowColor = d.color;
    ctx.shadowBlur = 18 * k;
    roundRect(d.x + (d.w - cw) / 2, d.y + (d.h - ch) / 2, cw, ch, 5);
    ctx.fill();
    ctx.restore();
  }

  for (const c of caps) {
    const info = CAP_TYPES[c.type];
    const spin = t * 3 + c.x * 0.05;
    // 落下トレイル
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 1; i <= 4; i++) {
      ctx.globalAlpha = 0.10 * (5 - i);
      ctx.fillStyle = info.color;
      ctx.beginPath();
      ctx.arc(c.x, c.y - i * 9, CAP_R * (1 - i * 0.16), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(Math.sin(spin) * 0.25);
    // 外周の回転リング
    ctx.strokeStyle = hexToRgba(info.color, 0.8);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, CAP_R + 3, spin, spin + Math.PI * 1.2);
    ctx.stroke();
    ctx.shadowColor = info.color;
    ctx.shadowBlur = 14;
    ctx.fillStyle = info.color;
    ctx.beginPath();
    ctx.arc(0, 0, CAP_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#0b0f1a";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(info.label, 0, 0);
    ctx.textBaseline = "alphabetic";
    ctx.restore();
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    if (p.shard) {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.r, -p.r * 0.7, p.r * 2, p.r * 1.4);
      ctx.restore();
    } else {
      ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
    }
  }
  ctx.globalAlpha = 1;

  // ヒットリング波
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const r of rings) {
    const a = r.life / r.maxLife;
    ctx.strokeStyle = hexToRgba(r.color, 0.55 * a);
    ctx.lineWidth = 2.5 * a + 0.5;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  // 火花（線分として描画）
  for (const s of sparks) {
    const a = s.life / s.max;
    const vm = Math.hypot(s.vx, s.vy) || 1;
    ctx.strokeStyle = hexToRgba(s.color, 0.9 * a);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - (s.vx / vm) * s.len * a, s.y - (s.vy / vm) * s.len * a);
    ctx.stroke();
  }
  // 衝撃波（太い輪郭が素早く拡大）
  for (const s of shocks) {
    const a = s.life / s.maxLife;
    ctx.strokeStyle = hexToRgba(s.color, 0.5 * a * a);
    ctx.lineWidth = 6 * a;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  // 花火
  for (const f of fireworks) {
    const a = f.life / f.max;
    ctx.fillStyle = f.color;
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(f.x, f.y, 1.8 + 1.4 * a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // パドル：エネルギーバー風
  ctx.save();
  const accent = wideT > 0 ? "#8bf05a" : "#6ab8ff";
  const squash = paddleHitT > 0 ? paddleHitT / 0.18 : 0;
  const ph = PADDLE_H * (1 - 0.25 * squash);
  const py = PADDLE_Y + (PADDLE_H - ph);
  ctx.shadowColor = accent;
  ctx.shadowBlur = 20 + 18 * squash;
  const pg = ctx.createLinearGradient(0, py, 0, py + ph);
  pg.addColorStop(0, "#f4f8ff");
  pg.addColorStop(0.5, accent);
  pg.addColorStop(1, shade(accent, -0.5));
  ctx.fillStyle = pg;
  roundRect(paddle.x, py, paddle.w, ph, 7);
  ctx.fill();
  ctx.shadowBlur = 0;
  // 上面の鏡面ライン
  ctx.strokeStyle = "rgba(255,255,255,0.8)";
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(paddle.x + 6, py + 1.4);
  ctx.lineTo(paddle.x + paddle.w - 6, py + 1.4);
  ctx.stroke();
  // 中央のコア発光
  const core = ctx.createRadialGradient(paddle.x + paddle.w / 2, py + ph / 2, 2, paddle.x + paddle.w / 2, py + ph / 2, paddle.w * 0.4);
  core.addColorStop(0, "rgba(255,255,255,0.55)");
  core.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = core;
  roundRect(paddle.x, py, paddle.w, ph, 7);
  ctx.fill();
  // 両端のストッパー発光
  for (const ex of [paddle.x + 3, paddle.x + paddle.w - 3]) {
    const eg = ctx.createRadialGradient(ex, py + ph / 2, 1, ex, py + ph / 2, 10);
    eg.addColorStop(0, "rgba(255,255,255,0.7)");
    eg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.arc(ex, py + ph / 2, 10, 0, Math.PI * 2);
    ctx.fill();
  }
  // 床への反射光
  const refl = ctx.createLinearGradient(0, py + ph, 0, py + ph + 26);
  refl.addColorStop(0, hexToRgba(accent, 0.22 + 0.2 * squash));
  refl.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = refl;
  ctx.fillRect(paddle.x - 6, py + ph, paddle.w + 12, 26);
  ctx.restore();

  // 反射角度ナビ：パドル反射後の最初の軌道を半透明の点線で表示
  if (navFade > 0.02 && (state === "playing" || state === "ready")) {
    ctx.save();
    ctx.globalAlpha = navFade * NAV.alpha;
    ctx.strokeStyle = wideT > 0 ? "#8bf05a" : "#7ec8ff";
    ctx.lineWidth = 1.5;
    ctx.setLineDash(NAV.dash);
    for (const b of balls) {
      if (b.stuck || b.vy <= 0 || b.y >= PADDLE_Y) continue;
      const dist = PADDLE_Y - b.y;
      if (dist >= NAV.showDist) continue;
      // パドル到達点（実際の衝突判定と同じ前提で直進予測）
      const hitX = clamp(b.x + b.vx * (dist / b.vy), paddle.x - BALL_R, paddle.x + paddle.w + BALL_R);
      // 実際の反射計算と同じロジック
      const rel = clamp((hitX - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const a = rel * (Math.PI * 0.35);
      const dx = Math.sin(a), dy = -Math.cos(a);
      ctx.beginPath();
      ctx.moveTo(hitX, PADDLE_Y - BALL_R);
      ctx.lineTo(hitX + dx * NAV.len, PADDLE_Y - BALL_R + dy * NAV.len);
      ctx.stroke();
      // 接点の小さなマーカー
      ctx.setLineDash([]);
      ctx.globalAlpha = navFade * 0.5;
      ctx.fillStyle = wideT > 0 ? "#8bf05a" : "#7ec8ff";
      ctx.beginPath();
      ctx.arc(hitX, PADDLE_Y - BALL_R, 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.setLineDash(NAV.dash);
      ctx.globalAlpha = navFade * NAV.alpha;
    }
    ctx.restore();
  }

  // ボール：ゴーストレール＋発光コア
  const comboHeat = Math.min(1, combo / 8);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const b of balls) {
    const n = b.trail.length;
    for (let i = 0; i < n; i++) {
      const tp = b.trail[i];
      const k = (i + 1) / n;
      const rG = Math.round(140 + 115 * comboHeat);
      ctx.fillStyle = "rgba(" + rG + "," + (190 - 60 * comboHeat) + ",255," + (0.16 * k * k).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, BALL_R * (0.25 + 0.75 * k), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  for (const b of balls) {
    const pulse = 1 + 0.12 * Math.sin(performance.now() / 1000 * 8) * comboHeat;
    if (fireT > 0) {
      const fg = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, BALL_R * 4.2);
      fg.addColorStop(0, "rgba(255,170,70,0.55)");
      fg.addColorStop(0.5, "rgba(255,90,40,0.22)");
      fg.addColorStop(1, "rgba(255,60,20,0)");
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R * 4.2, 0, Math.PI * 2);
      ctx.fill();
    }
    const halo = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, BALL_R * 3.2 * pulse);
    halo.addColorStop(0, "rgba(170,215,255,0.5)");
    halo.addColorStop(0.4, "rgba(140,190,255,0.18)");
    halo.addColorStop(1, "rgba(140,190,255,0)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_R * 3.2 * pulse, 0, Math.PI * 2);
    ctx.fill();
    if (comboHeat > 0.2) {
      const warm = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, BALL_R * 4.6);
      warm.addColorStop(0, "rgba(255,190,90," + (0.35 * comboHeat).toFixed(2) + ")");
      warm.addColorStop(1, "rgba(255,120,40,0)");
      ctx.fillStyle = warm;
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R * 4.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
  for (const b of balls) {
    ctx.save();
    ctx.shadowColor = comboHeat > 0.4 ? "#ffcf7a" : "#9ecbff";
    ctx.shadowBlur = 16 + 10 * comboHeat;
    const bg2 = ctx.createRadialGradient(b.x - 2.5, b.y - 2.5, 1, b.x, b.y, BALL_R);
    bg2.addColorStop(0, "#ffffff");
    bg2.addColorStop(0.6, comboHeat > 0.4 ? "#ffe9c8" : "#dcecff");
    bg2.addColorStop(1, comboHeat > 0.4 ? "#f2a95f" : "#8fb8f2");
    ctx.fillStyle = bg2;
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // レーザー光線
  if (lasers.length) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const L of lasers) {
      const lg = ctx.createLinearGradient(L.x, L.y, L.x, L.y + 26);
      lg.addColorStop(0, "rgba(255,110,210,0.95)");
      lg.addColorStop(1, "rgba(255,110,210,0)");
      ctx.fillStyle = lg;
      ctx.fillRect(L.x - 1.6, L.y, 3.2, 26);
      ctx.fillStyle = "rgba(255,235,250,0.95)";
      ctx.fillRect(L.x - 0.7, L.y, 1.4, 14);
    }
    ctx.restore();
  }

  // シールド（床の防御ライン）
  if (shieldT > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const sk = Math.min(1, shieldT / 1.5);
    const sg = ctx.createLinearGradient(0, H - 14, 0, H);
    sg.addColorStop(0, "rgba(89,230,208,0)");
    sg.addColorStop(1, "rgba(89,230,208," + (0.45 * sk).toFixed(2) + ")");
    ctx.fillStyle = sg;
    ctx.fillRect(0, H - 14, W, 14);
    ctx.strokeStyle = "rgba(140,255,235," + (0.75 * sk).toFixed(2) + ")";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, H - 3);
    ctx.lineTo(W, H - 3);
    ctx.stroke();
    ctx.restore();
  }

  for (const p of popups) {
    const k = p.life / p.max;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.4));
    // 出現直後にポップ拡大
    const scale = 1 + 0.5 * Math.max(0, (k - 0.75)) * 4;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(scale, scale);
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.fillStyle = p.color;
    ctx.font = "bold 15px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // ボールと壁の当たり光（加算合成）
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const b of balls) {
    if (b.stuck) continue;
    const near = [];
    if (b.x < 60) near.push([0, b.y, (60 - b.x) / 60]);
    if (b.x > W - 60) near.push([W, b.y, (60 - (W - b.x)) / 60]);
    if (b.y < 60) near.push([b.x, 0, (60 - b.y) / 60]);
    for (const [gx, gy, k] of near) {
      const g = ctx.createRadialGradient(gx, gy, 2, gx, gy, 70);
      g.addColorStop(0, "rgba(150,200,255," + (0.25 * k).toFixed(3) + ")");
      g.addColorStop(1, "rgba(150,200,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(gx - 70, gy - 70, 140, 140);
    }
  }
  // 破壊時の残光
  for (const g of glows) {
    const rg = ctx.createRadialGradient(g.x, g.y, 1, g.x, g.y, g.r);
    rg.addColorStop(0, hexToRgba(g.color, g.s));
    rg.addColorStop(1, hexToRgba(g.color, 0));
    ctx.fillStyle = rg;
    ctx.fillRect(g.x - g.r, g.y - g.r, g.r * 2, g.r * 2);
  }
  ctx.restore();

  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,0.35)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // 壁ヒット時の縁光り
  if (wallHitT > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const eg = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.85);
    eg.addColorStop(0, "rgba(120,180,255,0)");
    eg.addColorStop(1, "rgba(120,180,255," + (0.16 * (wallHitT / 0.12)).toFixed(3) + ")");
    ctx.fillStyle = eg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // ライフ喪失時の赤ビネット
  if (vignetteT > 0) {
    ctx.save();
    const rv = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.8);
    rv.addColorStop(0, "rgba(255,40,40,0)");
    rv.addColorStop(1, "rgba(255,30,30," + (0.22 * vignetteT).toFixed(3) + ")");
    ctx.fillStyle = rv;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // CRTスキャンライン（軽量：4px周期）
  ctx.save();
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = "#000";
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
  ctx.restore();

  // ズーム演出の拡大変換を終了（HUD・オーバーレイは等倍で描画）
  if (zooming) ctx.restore();

  // HUD（帯付きパネル）
  ctx.save();
  const hud = ctx.createLinearGradient(0, 0, 0, 40);
  hud.addColorStop(0, "rgba(8,12,22,0.85)");
  hud.addColorStop(1, "rgba(8,12,22,0)");
  ctx.fillStyle = hud;
  ctx.fillRect(0, 0, W, 40);
  ctx.strokeStyle = "rgba(126,200,255,0.25)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, 39.5); ctx.lineTo(W, 39.5);
  ctx.stroke();
  ctx.textAlign = "left";
  ctx.fillStyle = "#dfe6f5";
  ctx.font = "bold 18px sans-serif";
  ctx.fillText("SCORE " + score, 16, 27);
  ctx.textAlign = "right";
  ctx.fillStyle = "#ff7a8a";
  ctx.fillText("♥".repeat(Math.max(lives, 0)), W - 16, 27);
  ctx.textAlign = "center";
  ctx.fillStyle = "#8fa0c4";
  ctx.font = "14px sans-serif";
  ctx.fillText("STAGE " + (stage + 1) + " / " + STAGE_SPEEDS.length + "「" + (stageNames[stage] || "") + "」   BEST " + best, W / 2, 25);
  if (mode === 1) {
    ctx.fillStyle = "#7ee8ff";
    ctx.font = "bold 12px sans-serif";
    ctx.fillText("INNER STAGE", W / 2, 38);
  }
  ctx.restore();

  // ズーム演出のオーバーレイ（吸い込み/放出の暗転と渦）
  if (zooming) {
    ctx.fillStyle = "rgba(2,10,16," + (0.85 * zk).toFixed(2) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalAlpha = zk;
    ctx.strokeStyle = "#7ee8ff";
    ctx.lineWidth = 2;
    const vx = W / 2, vy = H / 2;
    for (const off of [0, Math.PI]) {
      ctx.beginPath();
      for (let i = 0; i <= 60; i++) {
        const a = t * 4 + off + i * 0.2;
        const r = 6 + i * 3.2;
        const px = vx + Math.cos(a) * r, py = vy + Math.sin(a) * r * 0.7;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.fillStyle = "#bdf3ff";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(state === "zoomin" ? "ブロックの内部へ…" : "内部から破裂！", W / 2, H / 2 - 140);
    ctx.restore();
  }

  if (combo >= 3) {
    const mult = (1 + Math.min(combo, 20) * 0.05).toFixed(2);
    ctx.fillStyle = "#ffe14a";
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("COMBO " + combo + "  x" + mult, W / 2, 52);
  }

  let ty = 44;
  if (wideT > 0) {
    ctx.fillStyle = "#8bf05a";
    ctx.fillRect(W / 2 - 60, ty, 120 * (wideT / WIDE_TIME), 5);
    ty += 10;
  }
  if (slowT > 0) {
    ctx.fillStyle = "#ff9f45";
    ctx.fillRect(W / 2 - 60, ty, 120 * (slowT / SLOW_TIME), 5);
    ty += 10;
  }
  if (laserT > 0) {
    ctx.fillStyle = "#ff6bd0";
    ctx.fillRect(W / 2 - 60, ty, 120 * (laserT / LASER_TIME), 5);
    ty += 10;
  }
  if (fireT > 0) {
    ctx.fillStyle = "#ff7a3d";
    ctx.fillRect(W / 2 - 60, ty, 120 * (fireT / FIRE_TIME), 5);
    ty += 10;
  }
  if (shieldT > 0) {
    ctx.fillStyle = "#59e6d0";
    ctx.fillRect(W / 2 - 60, ty, 120 * (shieldT / SHIELD_TIME), 5);
  }

  if (muted) {
    ctx.fillStyle = "#5a657d";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("MUTED (M)", 16, H - 40);
  }

  ctx.fillStyle = "#5a657d";
  ctx.font = "13px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("← → / A D : 移動   Space / クリック : 発射   P : 一時停止   M : サウンド", 16, H - 12);

  if (state === "ready") {
    if (mode === 1) {
      drawOverlay("内部ステージ", "#7ee8ff", ["ブロック内部に進入！", "この空間のブロックを全て壊して脱出しよう", "スペース or クリックで発射"]);
    } else {
      drawTitleDemo();
      if (justReturned) {
        drawOverlay("内部から復帰", "#7ee8ff", ["INNER CLEAR +" + RECURSE_BONUS, "スペース or クリックで発射"]);
      } else {
        drawOverlay("ブロック崩し", "#7ec8ff", ["STAGE " + (stage + 1) + " / " + STAGE_SPEEDS.length, "スペース or クリックで発射", "M: 多重球  W: ワイドパドル  S: スロー  +: 残り1", "★: ボーナス   ■: 鋼ブロック（3回必要）"]);
      }
    }
  } else if (state === "paused") {
    drawOverlay("一時停止", "#8fa0c4", ["P or クリックで再開"]);
  } else if (state === "levelclear") {
    drawOverlay("STAGE CLEAR!", "#8bf05a", ["BONUS +" + lives * 100, "SCORE " + score]);
  } else if (state === "win") {
    drawOverlay("ALL CLEAR!", "#8bf05a", ["SCORE " + score, "BEST " + best, "Enter or クリックでリスタート"]);
  } else if (state === "lose") {
    drawOverlay("GAME OVER", "#ff5252", ["SCORE " + score, "BEST " + best, "Enter or クリックでリスタート"]);
  }
}

// ---- メインループ ----
stars = makeStars();
reset(true);
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
